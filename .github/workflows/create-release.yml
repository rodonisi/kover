name: Create Release

on:
  workflow_dispatch:

jobs:
  version:
    uses: ./.github/workflows/get-version.yml

  create-tag:
    name: Create Git Tag
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ needs.version.outputs.version }} -m "Release v${{ needs.version.outputs.version }}"
          git push origin ${{ needs.version.outputs.version }}

  create-release:
    name: Create GitHub Release
    needs:
      - version
      - create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true

  bundle-apk:
    name: Bundle APK
    needs:
      - version
      - create-release
    permissions:
      contents: "write"
    uses: ./.github/workflows/bundle-apk.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build_number: ${{ needs.version.outputs.build_number }}
    secrets:
      GOOGLE_PLAY_KEYSTORE: ${{ secrets.GOOGLE_PLAY_KEYSTORE }}
      GOOGLE_PLAY_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_KEYSTORE_ALIAS: ${{ secrets.GOOGLE_PLAY_KEYSTORE_ALIAS }}
      GOOGLE_PLAY_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEY_PASSWORD }}

  bundle-windows:
    name: Bundle Windows
    needs:
      - version
      - create-release
    permissions:
      contents: write
    uses: ./.github/workflows/bundle-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build_number: ${{ needs.version.outputs.build_number }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  bundle-linux-appimage:
    name: Bundle Linux AppImage
    needs:
      - version
      - create-release
    permissions:
      contents: write
    uses: ./.github/workflows/bundle-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build_number: ${{ needs.version.outputs.build_number }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  get-release-body:
    name: Get Release Body
    needs:
      - version
      - create-release
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.get-body.outputs.body }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Release Body
        id: get-body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(gh release view ${{ needs.version.outputs.version }} --json body --jq '.body')

          CLEAN_BODY=$(echo "$BODY" | perl -0777 -pe '
            s/.*Full Changelog.*//gi;            # Remove "Full Changelog" line
            s/\s+by\s+(@[\w-]+|in).*//gm;        # Remove "by @user" or "by in"
            s/\s*\(#\d+\)//g;                    # Remove PR numbers
            s/https?:\/\/\S+//g;                 # Remove URLs
            s/^\s*[-*+]\s+/• /gm;                # Replace bullets
            s/<[^>]*>//g;                        # Remove HTML
            s/\[([^\]]+)\]\([^\)]+\)/$1/g;       # Strip Markdown links
            s/[*_]{1,3}//g;                      # Strip bold/italic
            s/^#+\s*//gm;                        # Remove header hashes
            s/^\s+//s'                           # STRIP ALL LEADING WHITESPACE
          )

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  promote-ios-public:
    name: Promote iOS Public Testflight
    needs: get-release-body
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ios

      - name: Promote Testflight Public
        run: |
          cd ios
          bundle exec fastlane public_beta
        env:
          CHANGELOG: ${{ needs.get-release-body.outputs.release_body }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

  promote-macos-public:
    name: Promote MacOS Public Testflight
    needs: get-release-body
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: macos

      - name: Promote Testflight Public
        run: |
          cd macos
          bundle exec fastlane public_beta
        env:
          CHANGELOG: ${{ needs.get-release-body.outputs.release_body }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

  promote-google-play-beta:
    name: Promote Google Play Beta Tracks
    needs: get-release-body
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate with Google Play
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: android

      - name: Promote Google Play
        run: |
          cd android
          bundle exec fastlane promote_beta_tracks
