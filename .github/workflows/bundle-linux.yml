name: Bundle Linux

on:
  workflow_call:
    inputs:
      version:
        description: "The semantic version"
        required: true
        type: string
      build_number:
        description: "The build number"
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true

jobs:
  build-and-upload-appimage:
    name: Build and upload AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get FVM Configuration
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config-action

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libcurl4-openssl-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Codegen
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: |
          flutter build linux --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }} --dart-define="SENTRY_DSN=${{ vars.SENTRY_DSN }}"

      - name: Package AppImage
        id: package
        env:
          RELEASE_NAME: Kover-linux-x86_64-${{ inputs.version }}.AppImage
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x linuxdeploy appimagetool
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/kover \
            --desktop-file linux/com.rodonisi.kover.desktop \
            --icon-file linux/com.rodonisi.kover.png
          ARCH=x86_64 VERSION=${{ inputs.version }} ./appimagetool --appimage-extract-and-run --no-appstream AppDir "$RELEASE_NAME"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Debug Symbols to Sentry
        env:
          SENTRY_RELEASE: ${{ vars.SENTRY_PROJECT }}@${{ inputs.version }}+${{ inputs.build_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.package.outputs.release_name }}
        run: |
          gh release upload ${{ inputs.version }} "$RELEASE_NAME"
