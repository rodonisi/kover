name: Bundle Windows

on:
  workflow_call:
    inputs:
      version:
        description: "The semantic version"
        required: true
        type: string
      build_number:
        description: "The build number"
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
      SIGNPATH_API_TOKEN:
        required: true
      SIGNPATH_ORGANIZATION_ID:
        required: true

env:
  RELEASE_NAME: Kover-${{ inputs.version }}-windows-x64

jobs:
  build-windows:
    name: Build and upload Windows
    runs-on: windows-latest
    outputs:
      portable-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get FVM Configuration
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config-action

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Codegen
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: |
          flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }} --dart-define="SENTRY_DSN=${{ vars.SENTRY_DSN }}"

      - name: Upload Debug Symbols to Sentry
        env:
          SENTRY_RELEASE: ${{ vars.SENTRY_PROJECT }}@${{ inputs.version }}+${{ inputs.build_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      - name: Upload artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_NAME }}
          path: build/windows/x64/runner/Release/

  sign-portable:
    name: Sign and upload portable build
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Submit portable signing request
        id: sign-portable
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-windows.outputs.portable-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
          skip-decompress: true

      - name: ls
        run: ls -l dist/signed

      # - name: Attach portable build to release
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     gh release upload "${{ inputs.version }}" "dist/signed/$RELEASE_NAME.zip" \
      #       --repo "${{ github.repository }}" --clobber

  build-msix:
    name: Build and sign MSIX
    runs-on: windows-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get FVM Configuration
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config-action

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.RELEASE_NAME }}
          path: build/windows/x64/runner/Release

      - name: Build MSIX
        shell: pwsh
        run: |
          dart run msix:create --build-windows false --install-certificate false `
            --version "${{ inputs.version }}.${{ inputs.build_number }}" `
            --output-path "dist/msix" `
            --output-name "$env:RELEASE_NAME"

      - name: Upload artifact
        id: upload-msix
        uses: actions/upload-artifact@v7
        with:
          path: dist/msix/${{ env.RELEASE_NAME }}.msix
          archive: false

      - name: Submit signing request
        id: sign-msix
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-msix.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
          skip-decompress: true

      - name: ls
        run: ls -l dist/signed

      # - name: Attach MSIX to release
      #   shell: pwsh
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     gh release upload "${{ inputs.version }}" "dist/signed/$env:RELEASE_NAME.msix" `
      #       --repo "${{ github.repository }}" --clobber
